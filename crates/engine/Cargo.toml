[package]
name = "statscraft-engine"
description = "Statscraft engine: executes parsed commands on a dataset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
statscraft-data = { path = "../data" }
statscraft-syntax = { path = "../syntax" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MIT OR Apache-2.0; the local date and time of )DATE and )TIME in CTABLES titles (already
# built for the data crate)
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# MIT; reads workbooks for GET DATA /TYPE=XLSX, XLSM and XLS
calamine = { version = "0.38.0", default-features = false }
# MIT; the hidden rows and columns of a workbook, which calamine does not report (the zip
# crate calamine and rust_xlsxwriter already build)
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
# MIT OR Apache-2.0; writes workbooks for SAVE TRANSLATE (already built for the export crate)
rust_xlsxwriter = "0.102.0"
# MIT OR Apache-2.0; NFC for the NORMALIZE function (already built for stringprep)
unicode-normalization = "0.1.26"
