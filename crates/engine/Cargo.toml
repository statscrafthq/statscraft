[package]
name = "statscraft-engine"
description = "Statscraft engine: executes parsed commands on a dataset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
statscraft-data = { path = "../data" }
statscraft-syntax = { path = "../syntax" }
serde = { version = "1", features = ["derive"] }
# preserve_order: the output file (.scout) keeps its keys in a fixed order; float_roundtrip:
# its numbers read back exactly (both already built for the data crate)
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# MIT OR Apache-2.0; the local date and time of )DATE and )TIME in CTABLES titles (already
# built for the data crate)
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# MIT; reads workbooks for GET DATA /TYPE=XLSX, XLSM and XLS
calamine = { version = "0.38.0", default-features = false }
# MIT; the hidden rows and columns of a workbook, which calamine does not report (the zip
# crate calamine and rust_xlsxwriter already build)
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
# MIT OR Apache-2.0; writes workbooks for SAVE TRANSLATE (already built for the export crate)
rust_xlsxwriter = "0.102.0"
# MIT OR Apache-2.0; NFC for the NORMALIZE function (already built for stringprep)
unicode-normalization = "0.1.26"
# Apache-2.0 OR MIT; turns a chart's SVG into PNG (through tiny-skia, BSD-3-Clause). Only the
# text feature: the bundled font is loaded by hand, so no system fonts and no raster images.
resvg = { version = "0.50.0", default-features = false, features = ["text"] }
# MIT OR Apache-2.0; measures text in the bundled font for the layout (already built for resvg)
skrifa = "0.49.0"
# MIT OR Apache-2.0; the JPG, BMP, TIF and gray PNG pictures of OUTPUT EXPORT (already built for the
# window's clipboard; its codecs are MIT, Apache-2.0, Zlib or BSD-3-Clause)
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "tiff"] }

[dev-dependencies]
# MIT OR Apache-2.0; reads the compressed Vega-Lite schema the chart tests check against
# (already built for zip)
flate2 = "1"
