[package]
name = "statscraft-data"
description = "Statscraft dataset and dictionary model, .sav reading and writing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
statscraft-sav = { path = "../sav" }
arrow = { version = "57", default-features = false }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: exact f64 parsing; preserve_order: value labels keep file order
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
