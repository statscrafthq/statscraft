[package]
name = "statscraft-export"
description = "StatsCraft export: result tables as an Excel workbook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
statscraft-engine = { path = "../engine" }
rust_xlsxwriter = "0.102.0"

[dev-dependencies]
# reads the written workbooks back in the tests; the same zip crate rust_xlsxwriter writes with
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
