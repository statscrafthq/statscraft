[package]
name = "statscraft-export"
description = "Statscraft export: result tables as an Excel workbook, charts as SVG and PNG pictures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
statscraft-engine = { path = "../engine" }

[dev-dependencies]
# reads the written workbooks back in the tests; the same zip crate rust_xlsxwriter writes with
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
