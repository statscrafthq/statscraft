[package]
name = "statscraft"
description = "Statistics workbench: command-line engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
statscraft-data = { path = "../data" }
statscraft-engine = { path = "../engine" }
statscraft-syntax = { path = "../syntax" }
serde_json = "1"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
