[package]
name = "statscraft-gui"
description = "StatsCraft desktop window: data editor, syntax, output and dialogs over the engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
statscraft-data = { path = "../data" }
statscraft-engine = { path = "../engine" }
statscraft-export = { path = "../export" }
statscraft-syntax = { path = "../syntax" }
statscraft-update = { path = "../update" }
# glow instead of the default wgpu keeps the build small. No default_fonts: the bundled fonts are
# not under MIT or Apache, so fonts.rs loads system fonts at startup.
eframe = { version = "0.37.0", default-features = false, features = ["glow", "accesskit", "clipboard", "wayland", "x11"] }
rfd = "0.18.0"
# rich text (HTML) on the clipboard, which egui cannot put there; already built for eframe
arboard = { version = "3.7.0", default-features = false }

# Embeds icons/statscraft.ico in the Windows executable (build.rs). Without default features it
# does not pull in toml, which only reads resource settings from Cargo.toml.
[build-dependencies]
winresource = { version = "0.1.34", default-features = false }
