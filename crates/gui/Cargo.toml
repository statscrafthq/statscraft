[package]
name = "statscraft-gui"
description = "Statscraft desktop window: data editor, syntax, output and dialogs over the engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
statscraft-connect = { path = "../connect" }
statscraft-data = { path = "../data" }
statscraft-engine = { path = "../engine" }
statscraft-export = { path = "../export" }
statscraft-syntax = { path = "../syntax" }
statscraft-update = { path = "../update" }
# glow instead of the default wgpu keeps the build small. links lets a click on a link open the
# browser (webbrowser, MIT OR Apache-2.0). No default_fonts: fonts.rs bundles the brand fonts
# (SIL Open Font License) instead of egui's.
eframe = { version = "0.37.0", default-features = false, features = ["glow", "accesskit", "clipboard", "links", "wayland", "x11"] }
rfd = "0.18.0"
# rich text (HTML) on the clipboard, which egui cannot put there; already built for eframe
arboard = { version = "3.7.0", default-features = false }

# Files Finder opens with the app (open_files.rs): the Objective-C runtime and AppKit bindings
# eframe already builds on macOS (objc2, block2, objc2-foundation: MIT; objc2-app-kit: Zlib OR
# Apache-2.0 OR MIT).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSEnumerator", "NSNotification", "NSOperation", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }

# Embeds icons/statscraft.ico in the Windows executable (build.rs). Without default features it
# does not pull in toml, which only reads resource settings from Cargo.toml.
[build-dependencies]
winresource = { version = "0.1.34", default-features = false }
