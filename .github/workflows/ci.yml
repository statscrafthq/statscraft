name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  terms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: scripts/check-terms.sh --tree
      - run: scripts/check-terms.sh --history HEAD

  build:
    needs: terms
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Check out the OpenStatSpec specification at the pinned commit
        shell: bash
        run: |
          echo "SPEC_COMMIT=$(cat crates/openstatspec/spec-commit)" >> "$GITHUB_ENV"
          echo "OPENSTATSPEC_DIR=${{ github.workspace }}/.spec" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          repository: OpenStatSpec/specification
          ref: ${{ env.SPEC_COMMIT }}
          path: .spec
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo run -p statscraft -- --version
