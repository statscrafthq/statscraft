name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  terms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: scripts/check-terms.sh --tree
      - run: scripts/check-terms.sh --history HEAD

  build:
    needs: terms
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # the compiled dependencies, three quarters of the build; saved from main only, so the
      # branches do not push its caches out of the 10 GB the repository gets
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
