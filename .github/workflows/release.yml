name: Release build

# Manual only: Actions > Release build > Run workflow. Windows gives a per-user installer and a
# portable .zip, Linux a .deb and a .tar.gz, macOS a .tar.gz with Statscraft.app and the command
# line for Apple silicon and Intel, each uploaded as its own artifact. The MCP bundles (.mcpb) for
# the three systems and the agent skill zip follow as one more artifact, with a SHA256SUMS of all.
# With "draft release" ticked, a draft GitHub Release vX.Y.Z (the version in the workspace
# Cargo.toml) is created with the same files and SHA256SUMS, which the updater checks every
# download against. Without it nothing is released. Publishing the draft stays a manual step:
# the updaters only see published releases.
on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Also create a draft GitHub Release with the packages
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Linux pinned: a newer runner links against a newer glibc than Ubuntu 24.04 has
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Windows signing with Azure Artifact Signing, on once these exist in the repository:
      # the secrets AZURE_TENANT_ID, AZURE_CLIENT_ID and AZURE_CLIENT_SECRET, an app registration
      # with the Artifact Signing Certificate Profile Signer role, and the variables
      # SIGNING_ENDPOINT (the account's region, e.g. https://neu.codesigning.azure.net),
      # SIGNING_ACCOUNT and SIGNING_PROFILE. Without them the Windows files stay unsigned.
      SIGN_WINDOWS: ${{ matrix.os == 'windows-latest' && secrets.AZURE_CLIENT_ID != '' && vars.SIGNING_PROFILE != '' }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os != 'macOS'
        run: cargo build --release --locked -p statscraft -p statscraft-gui
      # one universal program from both architectures; the Apple silicon runner builds both
      - if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p statscraft -p statscraft-gui --target "$target"
          done
      # the workspace version in Cargo.toml is the package version
      - shell: bash
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_ENV"
      # the signing client is a signtool plug-in that runs on .NET 10
      - if: env.SIGN_WINDOWS == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # signs both programs in place, so the installer and the .zip carry the signed ones
      - if: env.SIGN_WINDOWS == 'true'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
        run: |
          $dir = "$env:RUNNER_TEMP\signing"
          Invoke-WebRequest https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/1.0.151/microsoft.artifactsigning.client.1.0.151.nupkg -OutFile "$dir.zip"
          if ((Get-FileHash "$dir.zip").Hash -ne '35375A4BC4E1102DA729FC3D8D9925F774C3BAAE6B8B7FF6398D948CA9AB0D8A') { throw 'signing client checksum differs' }
          Expand-Archive "$dir.zip" $dir
          @{ Endpoint = $env:SIGNING_ENDPOINT; CodeSigningAccountName = $env:SIGNING_ACCOUNT; CertificateProfileName = $env:SIGNING_PROFILE } | ConvertTo-Json | Set-Content "$dir\metadata.json"
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          "SIGNTOOL=$signtool" >> $env:GITHUB_ENV
          "SIGNING_DIR=$dir" >> $env:GITHUB_ENV
          & $signtool sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib "$dir\bin\x64\Azure.CodeSigning.Dlib.dll" /dmdf "$dir\metadata.json" target\release\statscraft.exe target\release\statscraft-gui.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # Inno Setup 6 is preinstalled on the Windows runners. When signing, Inno Setup signs the
      # installer, the setup.tmp it runs from the temporary folder and the uninstaller itself,
      # with the command given as /Sazure ($q is a quote and $f the file for Inno Setup).
      - if: runner.os == 'Windows'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $options = @("/DAppVersion=$env:VERSION")
          if ($env:SIGN_WINDOWS -eq 'true') {
            $q = '$q'
            $options += '/DSign', "/Sazure=$q$env:SIGNTOOL$q sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib $q$env:SIGNING_DIR\bin\x64\Azure.CodeSigning.Dlib.dll$q /dmdf $q$env:SIGNING_DIR\metadata.json$q `$f"
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" @options packaging\windows\statscraft.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # the portable .zip: the installer's files in one folder, without the installer. The
      # updater knows it by LICENSE.txt next to the programs.
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          name=statscraft-$VERSION-windows-x86_64
          mkdir "target/packages/$name"
          cp target/release/statscraft.exe target/release/statscraft-gui.exe README.md "target/packages/$name/"
          cp LICENSE "target/packages/$name/LICENSE.txt"
          cd target/packages
          7z a -tzip "$name.zip" "$name"
          rm -r "$name"
      - if: runner.os == 'Linux'
        run: sh packaging/linux/build.sh "$VERSION"
      - if: runner.os == 'macOS'
        run: sh packaging/macos/build.sh "$VERSION"
      # Signing and notarizing for macOS, skipped: it needs an Apple Developer ID, which the
      # project does not have yet. To turn it on, add these repository secrets and drop
      # "false &&" from the condition:
      #   MACOS_CERTIFICATE           the Developer ID Application certificate, a .p12 in base64
      #   MACOS_CERTIFICATE_PASSWORD  the password of that .p12
      #   MACOS_SIGNING_IDENTITY      "Developer ID Application: Name (TEAMID)"
      #   APPLE_ID, APPLE_TEAM_ID     the developer account
      #   APPLE_APP_PASSWORD          an app-specific password of that account, for notarytool
      # It replaces the ad-hoc signatures of build.sh before the folder is packed.
      - if: false && runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          security create-keychain -p "" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
          security list-keychains -d user -s "$keychain"
          dir=target/packages/statscraft-$VERSION-macos-universal
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$dir/statscraft"
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$dir/Statscraft.app"
          ditto -c -k --keepParent "$dir" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$dir/Statscraft.app"
      # COPYFILE_DISABLE keeps macOS metadata (._ files) out of the archive
      - if: runner.os == 'macOS'
        run: |
          cd target/packages
          COPYFILE_DISABLE=1 tar -czf "statscraft-$VERSION-macos-universal.tar.gz" "statscraft-$VERSION-macos-universal"
      # archive: false uploads each file as it is; it takes one file per step
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: target/packages/statscraft-${{ env.VERSION }}-windows-x86_64-setup.exe
          archive: false
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: target/packages/statscraft-${{ env.VERSION }}-windows-x86_64.zip
          archive: false
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          path: target/packages/statscraft_${{ env.VERSION }}_amd64.deb
          archive: false
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          path: target/packages/statscraft-${{ env.VERSION }}-linux-x86_64.tar.gz
          archive: false
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          path: target/packages/statscraft-${{ env.VERSION }}-macos-universal.tar.gz
          archive: false

  # SHA256SUMS of every package, always; the draft release only with "draft release" ticked
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # skip-decompress: every artifact is one file as it is, and the .zip must stay a .zip
      - uses: actions/download-artifact@v8
        with:
          skip-decompress: true
          path: packages
          merge-multiple: true
      # the MCP bundles, one per platform, from the programs in the packages above; the official
      # mcpb tool (MIT) checks each manifest against the files of its bundle. And the agent skill
      # as a zip with its folder, the form claude.ai uploads.
      - run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          python3 packaging/mcpb/build.py "$version" packages
          for bundle in packages/*.mcpb; do
            dir=$RUNNER_TEMP/$(basename "$bundle" .mcpb)
            unzip -q "$bundle" -d "$dir"
            npx --yes @anthropic-ai/mcpb@2.1.2 validate "$dir/manifest.json"
          done
          cd plugins/statscraft/skills
          zip -qr "$GITHUB_WORKSPACE/packages/statscraft-$version-skill.zip" statscraft-analysis
      - uses: actions/upload-artifact@v7
        with:
          name: agents
          path: |
            packages/*.mcpb
            packages/*-skill.zip
      - run: cd packages && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          path: packages/SHA256SUMS
          archive: false
      - if: inputs.draft_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          gh release create "v$version" packages/* --draft --target "$GITHUB_SHA" --title "Statscraft $version" --generate-notes
