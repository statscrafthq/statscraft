[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
# eframe 0.37 needs 1.95
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/statscrafthq/statscraft"

# Keep debug builds small: line tables are enough for backtraces, and dependencies need none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
