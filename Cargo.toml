[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.32.0"
edition = "2024"
# eframe 0.37 needs 1.95
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/statscrafthq/statscraft"

# Keep debug builds small: line tables are enough for backtraces, and dependencies need none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The PNG and deflate code that writes pictures and PDF files runs about five times slower
# unoptimized, which made the output tests the slowest of all.
[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

# The studentized range, maximum modulus and Dunnett integrals of the post hoc tests run about
# nine times slower unoptimized.
[profile.dev.package.statscraft-dist]
opt-level = 3
